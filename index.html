    <script>
      // Show a Chrome option in KakaoTalk and other Android browsers.
      // Do not automatically redirect: Android may choose Samsung Internet.
      document.addEventListener('DOMContentLoaded', function () {
        const ua = navigator.userAgent;
        const isAndroid = /Android/i.test(ua);
        const isKakao = /KAKAOTALK/i.test(ua);
        const isChrome = /Chrome\//i.test(ua) && !/SamsungBrowser|EdgA|OPR|KAKAOTALK/i.test(ua);
        if (!isAndroid || (isChrome && !isKakao)) return;
        const notice = document.createElement('div');
        notice.style.cssText = 'box-sizing:border-box;width:100%;max-width:500px;margin:0 auto 16px;padding:14px;border-radius:12px;background:#fef3c7;color:#78350f;text-align:center;font:600 14px/1.5 system-ui';
        const heading = document.createElement('div');
        heading.textContent = 'The English Corner works best in Google Chrome.';
        const button = document.createElement('a');
        button.textContent = 'Open in Google Chrome ↗';
        button.style.cssText = 'display:inline-block;margin-top:9px;padding:9px 14px;border-radius:8px;background:#78350f;color:white;text-decoration:none;font-weight:700';
        const currentUrl = location.href;
        const withoutScheme = currentUrl.replace(/^https?:\/\//, '');
        button.href = 'intent://' + withoutScheme + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(currentUrl) + ';end';
        const help = document.createElement('div');
        help.textContent = 'If the button does not work, copy this page link and paste it into Chrome.';
        help.style.cssText = 'margin-top:8px;font:400 12px/1.5 system-ui';
        notice.append(heading, button, help);
        const container = document.querySelector('.container') || document.body;
        container.prepend(notice);
      });
    </script>

    <div class="install-wrap" id="install-wrap">
      <button class="install-button" id="install-button" type="button" aria-expanded="false" aria-controls="install-guide"><img class="install-icon-preview" src="./icons/icon-192.png?v=reps-sharp" alt="" width="48" height="48"><span class="install-button-copy"><span>📲 Reps 앱 설치하기</span><span class="install-button-hint">홈 화면에서 한 번에 영어 복습!</span></span></button>
      <div class="install-guide" id="install-guide" role="status" aria-live="polite"></div>
    </div>
    <script>
      (function () {
        const ua = navigator.userAgent;
        const isIOS = /iPad|iPhone|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isAndroid = /Android/i.test(ua);
        const isKakao = /KAKAOTALK/i.test(ua);
        const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        const wrap = document.getElementById('install-wrap');
        const button = document.getElementById('install-button');
        const guide = document.getElementById('install-guide');
        let promptEvent = null;

        function refresh() {
          wrap.style.display = !isStandalone() ? 'block' : 'none';
        }
        function showGuide(message) {
          guide.textContent = message;
          guide.style.display = 'block';
          button.setAttribute('aria-expanded', 'true');
        }
        window.addEventListener('beforeinstallprompt', function (event) {
          event.preventDefault();
          promptEvent = event;
          refresh();
        });
        window.addEventListener('appinstalled', function () {
          promptEvent = null;
          wrap.style.display = 'none';
        });
        window.addEventListener('pageshow', refresh);
        refresh();

        button.addEventListener('click', async function () {
          if (promptEvent) {
            const event = promptEvent;
            promptEvent = null;
            try { await event.prompt(); await event.userChoice; } catch (e) { /* manual instructions remain available */ }
            if (!isStandalone()) {
              showGuide('설치 창이 나타나지 않으면 Chrome 메뉴(⋮) → 홈 화면에 추가 또는 앱 설치를 선택해 주세요.');
            }
            return;
          }
          if (isKakao && isIOS) {
            showGuide('오른쪽 아래 공유 버튼(□↑)을 눌러 Safari에서 열어 주세요. “Safari에서 열기”가 보이지 않으면 링크를 복사해 Safari에 붙여 넣어 주세요. Safari에서 공유 → 홈 화면에 추가를 선택하면 돼요.');
          } else if (isKakao) {
            showGuide('카카오톡 안에서는 바로 설치할 수 없어요. 오른쪽 위 메뉴(⋮) → 다른 브라우저로 열기를 선택한 후 Chrome에서 설치해 주세요.');
          } else if (isIOS) {
            showGuide('Safari에서 열고 공유 버튼(□↑) → 홈 화면에 추가 → 추가를 선택하세요. 가능한 경우 “웹 앱으로 열기”를 켜 주세요.');
          } else if (isAndroid) {
            showGuide('Chrome 메뉴(⋮) → 앱 설치 또는 홈 화면에 추가를 선택하세요.');
          } else {
            showGuide('휴대폰에서 이 사이트를 열어 주세요. Android는 Chrome 메뉴(⋮) → 앱 설치, iPhone은 Safari 공유 버튼 → 홈 화면에 추가를 선택하세요.');
          }
        });
      })();
    </script>

      </div>
      <iframe id="english-corner-embed" src="english-corner.html?embed=1" title="The English Corner: today's bonus activity" style="width:100%;height:210px;border:0;border-radius:14px;background:#0f172a;position:absolute;opacity:0;pointer-events:none;" loading="eager"></iframe>

    </section>
    <script>
      // Show only the previously published PUBLIC activity, never student replies.
      try {
        const cached=JSON.parse(localStorage.getItem('reps-public-activity-v1')||'null');
        const koreaDate=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
        if(cached&&cached.id<=koreaDate&&Date.now()-cached.savedAt<96*60*60*1000){
          const preview=document.getElementById('activity-splash-prompt');
          if(preview)preview.textContent=cached.activity.question||'오늘의 활동을 불러오는 중이에요…';
        }
      } catch (_) {}
    </script>
    <script>
      window.addEventListener('message', function(event) {
        if (event.origin !== window.location.origin || !event.data) return;
        const frame = document.getElementById('english-corner-embed');
        if(event.source !== frame.contentWindow)return;
        if(event.data.type === 'english-corner-ready'){
          const splash=document.getElementById('activity-splash');
          if(splash)splash.style.display='none';
          frame.style.position='static';
          frame.style.opacity='1';
          frame.style.pointerEvents='auto';
          frame.style.display='block';
          return;
        }
        if(event.data.type !== 'english-corner-height')return;
        if (frame && event.source === frame.contentWindow && Number.isFinite(event.data.height)) {
          frame.style.height = Math.max(140, Math.min(12000, event.data.height)) + 'px';
        }
      });
    </script>
