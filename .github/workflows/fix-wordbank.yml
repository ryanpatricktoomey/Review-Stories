name: Fix Wordbank Script Across All Files
on: workflow_dispatch

permissions:
  contents: write

jobs:
  fix-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove chat.js tag if present
        run: |
          find . -type f -name "*.html" -exec sed -i '/<script src="chat.js"><\/script>/d' {} +

      - name: Safely add wordbank-utils.js ONLY if missing
        run: |
          find . -type f -name "*.html" -exec grep -L "wordbank-utils.js" {} + | while read -r file; do
            sed -i 's/<\/body>/  <script src="wordbank-utils.js"><\/script>\n<\/body>/' "$file"
          done

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "Automated fix: Standardize wordbank-utils.js and remove chat.js"
            git push
          else
            echo "No changes detected."
          fi
