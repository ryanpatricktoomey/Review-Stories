    <script>
      (function () {
        const ua = navigator.userAgent;
        const isIOS = /iPad|iPhone|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isAndroid = /Android/i.test(ua);
        const isKakao = /KAKAOTALK/i.test(ua);
        const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        const wrap = document.getElementById('install-wrap');
        const button = document.getElementById('install-button');
        const guide = document.getElementById('install-guide');
        let promptEvent = null;

        function refresh() {
          wrap.style.display = !isStandalone() ? 'block' : 'none';
        }
        function showGuide(message) {
          guide.textContent = message;
          guide.style.display = 'block';
          button.setAttribute('aria-expanded', 'true');
        }
        window.addEventListener('beforeinstallprompt', function (event) {
          event.preventDefault();
          promptEvent = event;
          refresh();
        });
        window.addEventListener('appinstalled', function () {
          promptEvent = null;
          wrap.style.display = 'none';
        });
        window.addEventListener('pageshow', refresh);
        refresh();

        button.addEventListener('click', async function () {
          if (promptEvent) {
            const event = promptEvent;
            promptEvent = null;
            try { await event.prompt(); await event.userChoice; } catch (e) { /* manual instructions remain available */ }
            if (!isStandalone()) {
              showGuide('설치 창이 나타나지 않으면 Chrome 메뉴(⋮) → 홈 화면에 추가 또는 앱 설치를 선택해 주세요.');
            }
            return;
          }
          if (isKakao && isIOS) {
            showGuide('오른쪽 아래 공유 버튼(□↑)을 눌러 Safari에서 열어 주세요. “Safari에서 열기”가 보이지 않으면 링크를 복사해 Safari에 붙여 넣어 주세요. Safari에서 공유 → 홈 화면에 추가를 선택하면 돼요.');
          } else if (isKakao) {
            showGuide('카카오톡 안에서는 바로 설치할 수 없어요. 오른쪽 위 메뉴(⋮) → 다른 브라우저로 열기를 선택한 후 Chrome에서 설치해 주세요.');
          } else if (isIOS) {
            showGuide('Safari에서 열고 공유 버튼(□↑) → 홈 화면에 추가 → 추가를 선택하세요. 가능한 경우 “웹 앱으로 열기”를 켜 주세요.');
          } else if (isAndroid) {
            showGuide('Chrome 메뉴(⋮) → 앱 설치 또는 홈 화면에 추가를 선택하세요.');
          } else {
            showGuide('휴대폰에서 이 사이트를 열어 주세요. Android는 Chrome 메뉴(⋮) → 앱 설치, iPhone은 Safari 공유 버튼 → 홈 화면에 추가를 선택하세요.');
          }
        });
      })();
    </script>

    <script>

    <script>
      window.addEventListener('message', function(event) {
        if (event.origin !== window.location.origin || !event.data) return;
        const frame = document.getElementById('english-corner-embed');
        if(event.source !== frame.contentWindow)return;
        if(event.data.type === 'english-corner-ready'){
          const splash=document.getElementById('activity-splash');
          if(splash)splash.style.display='none';
          frame.style.position='static';
          frame.style.opacity='1';
          frame.style.pointerEvents='auto';
          frame.style.display='block';
          return;
        }
        if(event.data.type !== 'english-corner-height')return;
        if (frame && event.source === frame.contentWindow && Number.isFinite(event.data.height)) {
          frame.style.height = Math.max(80, Math.min(12000, event.data.height)) + 'px';
        }
      });
    </script>

<script>
const reviewHome=document.getElementById('review-home'), grid=document.getElementById('daily-grid');
grid.before(reviewHome);
for(const [buttonId,panelId] of [['review-toggle','review-content'],['bonus-toggle','bonus-panel']]){
 const button=document.getElementById(buttonId),panel=document.getElementById(panelId);
 const arrow=button.querySelector('span[aria-hidden="true"]');arrow.classList.add('reps-chevron');
 let motion;
 button.addEventListener('click',()=>{
  const opening=button.getAttribute('aria-expanded')!=='true';
  const start=panel.hidden?0:panel.getBoundingClientRect().height;
  if(motion){motion.cancel();motion=null}
  button.setAttribute('aria-expanded',String(opening));
  panel.hidden=false;panel.inert=!opening;
  if(opening&&panelId==='bonus-panel'){const frame=document.getElementById('english-corner-embed');frame.contentWindow?.postMessage({type:'reps-resize'},location.origin);window.dispatchEvent(new Event('resize'))}
  const end=opening?panel.getBoundingClientRect().height:0;
  // The embedded activity can resize while opening. Keep its natural height
  // and reveal it with a compositor animation instead of animating height.
  if(panelId==='bonus-panel'){
   if(matchMedia('(prefers-reduced-motion: reduce)').matches||!panel.animate){panel.hidden=!opening;return}
   const a=panel.animate(opening?[{opacity:0,clipPath:'inset(0 0 100% 0)'},{opacity:1,clipPath:'inset(0 0 0% 0)'}]:[{opacity:1,clipPath:'inset(0 0 0% 0)'},{opacity:0,clipPath:'inset(0 0 100% 0)'}],{duration:280,easing:'cubic-bezier(.25,.65,.25,1)'});
   motion=a;a.onfinish=()=>{if(motion!==a)return;panel.hidden=!opening;motion=null};return;
  }
  if(matchMedia('(prefers-reduced-motion: reduce)').matches||!panel.animate){panel.hidden=!opening;return}
  const anim=panel.animate([{height:start+'px',overflow:'clip',opacity:opening?.65:1},{height:end+'px',overflow:'clip',opacity:opening?1:.65}],{duration:220,easing:'cubic-bezier(.2,.7,.2,1)'});
  motion=anim;anim.onfinish=()=>{if(motion!==anim)return;panel.hidden=!opening;motion=null};
 });
}
</script>
