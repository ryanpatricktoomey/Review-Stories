<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>☕ The English Corner</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:12px;background:#0f172a;color:#f8fafc;font:16px/1.55 system-ui,-apple-system,sans-serif}.wrap{max-width:680px;margin:auto}a{color:#38bdf8}.card{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:20px;margin:18px 0}h1{margin:12px 0}h2{margin:0 0 12px;font-size:1.2rem}.muted{color:#a7b6cb}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,select,textarea,button{font:inherit;border-radius:10px;padding:10px}input,select,textarea{width:100%;background:#0f172a;border:1px solid #64748b;color:white}textarea{min-height:85px}button{background:#14b8a6;color:#082f30;border:0;font-weight:700;cursor:pointer}button.secondary{background:#334155;color:white}button:disabled{opacity:.55;cursor:not-allowed}.hidden{display:none!important}.activity-text{white-space:pre-wrap;overflow-wrap:anywhere}.reply{border-top:1px solid #475569;padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.reply strong{color:#5eead4}.meta{font-size:.82rem;color:#a7b6cb}.activity-type{font-size:1.08rem;font-weight:800;color:#5eead4;margin:7px 0 5px}label{display:block;margin:10px 0 5px}#status{min-height:24px;color:#fbbf24}.small{font-size:.88rem}
</style></head><body><main class="wrap">
<a id="back-link" href="index.html">← Review Stories</a><h1>☕ The English Corner</h1>
<p class="muted" id="corner-intro">A little English practice, together.</p>
<div id="status" role="status"></div>
<section id="account" class="card hidden"><div class="row"><span id="account-label">Checking sign-in…</span><button id="signin" class="hidden">Sign in with Google</button><button id="signout" class="secondary hidden">Sign out</button></div></section>
<section id="profile-card" class="card hidden"><h2>What should we call you?</h2><button id="close-profile" type="button" class="secondary small hidden">Close</button><p class="muted small">Choose a nickname and class time. Only these are shown publicly, not your Google email.</p>
<form id="profile-form"><label for="nickname">Nickname</label><input id="nickname" maxlength="30" required placeholder="e.g. Sophia">
<label for="class-time">Class time</label><select id="class-time" required><option value="">Choose your class</option><option>06:30</option><option>07:15</option><option>08:45</option><option>09:30</option><option>10:20</option><option>12:00</option></select><p><button type="submit">Save my profile</button></p></form><div id="profile-account" class="row"><span id="profile-account-label" class="muted small"></span><button id="profile-signin" type="button" class="secondary hidden">Sign in with Google</button><button id="profile-signout" type="button" class="secondary hidden">Sign out</button></div></section>
<p id="teacher-link" class="hidden"><a href="english-corner-admin.html">Teacher dashboard →</a></p>
<section class="card" id="activity-section"><h2 id="activity-heading">Today's Activity</h2><div id="activities"><p class="muted">Loading activities…</p></div></section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(()=>{
'use strict';
const config={apiKey:"AIzaSyAdBI_1FG1JnY-NAopcx6YnApNq7l7OcKA",authDomain:"review-stories-f251f.firebaseapp.com",projectId:"review-stories-f251f",storageBucket:"review-stories-f251f.firebasestorage.app",messagingSenderId:"974755614972",appId:"1:974755614972:web:3e21c5c7ccdfa5f9824779"};
const ADMIN_UID="VWok43w84cbFLVdn7zB9NeTTVbG2";
if(!firebase.apps.length)firebase.initializeApp(config);
const auth=firebase.auth(),db=firebase.firestore(),$=id=>document.getElementById(id);
if(new URLSearchParams(location.search).get('embed')==='1'){
  $('back-link').classList.add('hidden');
  document.body.style.padding='0';
  document.querySelector('.wrap').style.maxWidth='none';
  const reportHeight=()=>window.parent.postMessage({type:'english-corner-height',height:document.documentElement.scrollHeight},location.origin);
  if(window.ResizeObserver)new ResizeObserver(reportHeight).observe(document.body);
  window.addEventListener('load',reportHeight);
  setTimeout(reportHeight,100);
}
const isEmbed=new URLSearchParams(location.search).get('embed')==='1',isArchive=new URLSearchParams(location.search).get('archive')==='1';
if(isEmbed){document.querySelector('main.wrap > h1').classList.add('hidden');$('account').classList.add('hidden');$('profile-card').classList.add('hidden');$('corner-intro').classList.add('hidden');$('activity-section').style.margin='0';$('activity-section').style.padding='14px';$('activity-heading').style.fontSize='1.05rem'}
if(isArchive)$('activity-heading').textContent='English Corner Archive';
let user=null,profile=null,stopActivities=null,stopResponses=[];
function showProfile(){ if(isEmbed)return; $('profile-card').classList.remove('hidden');$('close-profile').classList.toggle('hidden',!profile); }
function hideProfile(){if(profile)$('profile-card').classList.add('hidden')}
$('close-profile').onclick=hideProfile;
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='english-corner-manage-profile')location.href='english-corner-profile.html'});
function status(s){$('status').textContent=s}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function clearSubs(){if(stopActivities){stopActivities();stopActivities=null}stopResponses.forEach(f=>f());stopResponses=[]}
$('signin').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>status(e.message));
$('signout').onclick=()=>auth.signOut().catch(e=>status(e.message));
$('profile-signin').onclick=()=>$('signin').click();
$('profile-signout').onclick=()=>$('signout').click();
auth.onAuthStateChanged(async u=>{
user=u;profile=null;clearSubs();$('signin').classList.toggle('hidden',!!u);$('signout').classList.toggle('hidden',!u);$('account-label').textContent=u?'Signed in with Google':'Browsing as a visitor';
$('teacher-link').classList.toggle('hidden',!u||u.uid!==ADMIN_UID);$('profile-card').classList.add('hidden');$('profile-signin').classList.toggle('hidden',!!u);$('profile-signout').classList.toggle('hidden',!u);$('profile-account-label').textContent=u?'Signed in with Google':'Not signed in';
if(u){try{const snap=await db.collection('publicProfiles').doc(u.uid).get();if(auth.currentUser?.uid!==u.uid)return;if(snap.exists){profile=snap.data();$('nickname').value=profile.nickname||'';$('class-time').value=profile.classTime||'';$('profile-card').querySelector('h2').textContent='Edit your profile';} if(!profile){window.parent===window?location.href='english-corner-profile.html?setup=1':window.parent.postMessage({type:'english-corner-setup-needed'},location.origin)}}catch(e){status('Profile unavailable: '+e.message)}}

listenActivities();
});
$('profile-form').onsubmit=async e=>{e.preventDefault();if(!user)return;const nickname=$('nickname').value.trim(),classTime=$('class-time').value;if(nickname.length<2||nickname.length>30||!['06:30','07:15','08:45','09:30','10:20','12:00'].includes(classTime)){status('Enter a nickname (2–30 characters) and select a class.');return}try{await db.collection('publicProfiles').doc(user.uid).set({nickname,classTime});profile={nickname,classTime};status('Profile saved!');hideProfile();listenActivities()}catch(err){status('Could not save profile: '+err.message)}};
function listenActivities(){clearSubs();$('activities').replaceChildren(el('p','muted','Loading activities…'));stopActivities=db.collection('activities').where('published','==',true).limit(100).onSnapshot(snap=>{stopResponses.forEach(f=>f());stopResponses=[];$('activities').replaceChildren();if(snap.empty){$('activities').append(el('p','muted','No activities yet. Check back soon!'));return}snap.docs.filter(d=>d.id<=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())).sort((a,b)=>b.id.localeCompare(a.id)).slice(0,isArchive?30:1).forEach(d=>renderActivity(d))},e=>{status('Could not load activities: '+e.message);$('activities').replaceChildren(el('p','muted','Activities unavailable.'))})}
function renderActivity(doc){const data=doc.data(),box=el('article','card'),head=el('h2','',data.question||'Question'),date=el('div','meta',data.date||doc.id);head.classList.add('activity-text');box.append(date,el('div','activity-type',({question:'💬 Daily Question',challenge:'🎯 English Challenge',expression:'💡 Expression of the Day',poll:'📊 Poll',quiz:'🧠 Quiz'})[data.type]||'💬 Daily Question'),head);if(data.meaning)box.append(el('p','muted activity-text',data.meaning));if(data.options?.length){const opts=el('div','muted');data.options.forEach((v,i)=>opts.append(el('p','',String(i+1)+'. '+v)));box.append(opts)}if(data.hint)box.append(el('p','muted activity-text',data.hint));const replies=el('div');box.append(replies);const form=el('form');if(user&&profile){const label=el('label','',data.type==='poll'||data.type==='quiz'?'Your choice (and why!)':'Your answer');const input=el('textarea');input.maxLength=500;input.required=true;input.placeholder='Share your answer in English…';const submit=el('button','','Post answer');form.append(label,input,submit);form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text||!user||!profile)return;submit.disabled=true;try{await db.collection('activities').doc(doc.id).collection('responses').doc(user.uid).set({uid:user.uid,text,nickname:profile.nickname,classTime:profile.classTime,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});input.value='';status('Answer saved!')}catch(err){status('Could not post: '+err.message)}finally{submit.disabled=false}}}else{const prompt=el('p','muted small');prompt.append(document.createTextNode(user?'Choose a nickname and class time to answer. ':'Sign in and set up your profile to answer. '));const link=el('a','','👤 Set Up Your Profile to Answer →');link.href='english-corner-profile.html'+(user?'?setup=1':'');link.target='_top';prompt.append(link);form.append(prompt)}box.append(form);$('activities').append(box);
const stop=db.collection('activities').doc(doc.id).collection('responses').orderBy('updatedAt','desc').limit(100).onSnapshot(s=>{replies.replaceChildren(el('p','meta',s.size+' participant'+(s.size===1?'':'s')));s.forEach(item=>{const r=item.data(),row=el('div','reply'),who=el('strong','',((r.nickname||'Student')+' · '+(r.classTime||''))),message=el('div','',r.text||'');row.append(who,message);if(user&&user.uid===r.uid){const del=el('button','secondary small','Delete my answer');del.onclick=async()=>{if(!confirm('Delete your answer?'))return;try{await item.ref.delete()}catch(err){status(err.message)}};row.append(del)}replies.append(row)})},e=>{replies.replaceChildren(el('p','muted','Responses unavailable: '+e.message))});stopResponses.push(stop)}
})();
</script></body></html>
