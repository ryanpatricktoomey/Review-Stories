name: Refresh Reps App Icons (manual)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy.yml'

permissions:
  contents: write


jobs:
  refresh-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate Reps app icons
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, io
          encoded = "".join(Path(f".github/reps-hires.part{i}").read_text().strip() for i in range(1, 5))
          source = base64.b64decode(encoded, validate=True)
          with Image.open(io.BytesIO(source)) as image:
              image.load()
              assert image.width >= 384 and image.height >= 384, "Reps icon source too small"
              original = image.convert("RGBA")
          icons = Path("icons")
          icons.mkdir(exist_ok=True)
          for size, filename in [(192, "icon-192.png"), (512, "icon-512.png"), (180, "apple-touch-icon.png")]:
              # Preserve the original artwork inside Android's circular safe zone.
              canvas = Image.new("RGBA", (size, size), "#0f172a")
              inner = round(size * 0.76)
              art = original.copy()
              art.thumbnail((inner, inner), Image.Resampling.LANCZOS)
              canvas.alpha_composite(art, ((size-art.width)//2, (size-art.height)//2))
              canvas.convert("RGB").save(icons / filename, optimize=True)
          print("Generated Reps app icons")
          PY
      - name: Restore approved Reps wordmark image
        run: |
          mkdir -p assets
          base64 --decode .github/reps-header.b64 > assets/reps-header.webp
          file assets/reps-header.webp
      - name: Store official app icons in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png assets/reps-header.webp
          if ! git diff --cached --quiet; then
            git commit -m "Keep official Reps icons in repository"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
