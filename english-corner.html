</style></head><body><main class="wrap">
<a id="back-link" href="index.html">← Review Stories</a><h1>☕ The English Corner</h1>

<section id="profile-card" class="card hidden"><h2>What should we call you?</h2><button id="close-profile" type="button" class="secondary small hidden">Close</button><p class="muted small">Choose a nickname and class time. Only these are shown publicly, not your Google email.</p>

<script>
(()=>{
'use strict';

});
$('profile-form').onsubmit=async e=>{e.preventDefault();if(!user)return;const nickname=$('nickname').value.trim(),classTime=$('class-time').value;if(nickname.length<2||nickname.length>30||!['06:30','07:15','08:45','09:30','10:20','12:00'].includes(classTime)){status('Enter a nickname (2–30 characters) and select a class.');return}try{await db.collection('publicProfiles').doc(user.uid).set({nickname,classTime});profile={nickname,classTime};status('Profile saved!');hideProfile();listenActivities()}catch(err){status('Could not save profile: '+err.message)}};
function listenActivities(){clearSubs();$('activities').replaceChildren(el('p','muted','Loading activities…'));stopActivities=db.collection('activities').where('published','==',true).limit(100).onSnapshot(snap=>{stopResponses.forEach(f=>f());stopResponses=[];$('activities').replaceChildren();if(snap.empty){$('activities').append(el('p','muted','No activities yet. Check back soon!'));return}snap.docs.filter(d=>d.id<=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())).sort((a,b)=>b.id.localeCompare(a.id)).filter(d=>!targetActivity||d.id===targetActivity).slice(0,isArchive?30:1).forEach(d=>renderActivity(d))},e=>{status('Could not load activities: '+e.message);$('activities').replaceChildren(el('p','muted','Activities unavailable.'))})}
function renderActivity(doc){const data=doc.data(),box=el('article','card'),head=el('h2','',data.question||'Question'),date=el('div','meta',data.date||doc.id);box.id='activity-'+doc.id;head.classList.add('activity-text');box.append(date,el('div','activity-type',({question:'💬 Daily Question',challenge:'🎯 English Challenge',expression:'💡 Expression of the Day',poll:'📊 Poll',quiz:'🧠 Quiz'})[data.type]||'💬 Daily Question'),head);if(data.meaning)box.append(el('p','muted activity-text',data.meaning));if(data.options?.length){const opts=el('div','muted');data.options.forEach((v,i)=>opts.append(el('p','',String(i+1)+'. '+v)));box.append(opts)}if(data.hint)box.append(el('p','muted activity-text',data.hint));const replies=el('div');box.append(replies);const isVote=['poll','quiz'].includes(data.type);const form=el('form');if(user&&profile){const label=el('label','',data.type==='poll'||data.type==='quiz'?'Your choice (and why!)':'Your answer');const input=el('textarea');input.maxLength=500;input.required=true;input.placeholder='Share your answer in English…';const singleAnswer=['poll','quiz'].includes(data.type);const submit=el('button','','Post answer');form.append(label,input,submit);form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text||!user||!profile)return;submit.disabled=true;try{const ref=db.collection('activities').doc(doc.id).collection('responses');await (singleAnswer?ref.doc(user.uid).set({uid:user.uid,text,nickname:profile.nickname,classTime:profile.classTime,emoji:profile.emoji||'😊',updatedAt:firebase.firestore.FieldValue.serverTimestamp()}):ref.add({uid:user.uid,text,nickname:profile.nickname,classTime:profile.classTime,emoji:profile.emoji||'😊',updatedAt:firebase.firestore.FieldValue.serverTimestamp()}));input.value='';status('Answer saved!')}catch(err){status('Could not post: '+err.message)}finally{submit.disabled=false}}}else{const prompt=el('p','muted small');prompt.append(document.createTextNode(user?'Choose a nickname and class time to answer. ':'Sign in and set up your profile to answer. '));const link=el('a','','👤 Set Up Your Profile to Answer →');link.href='english-corner-profile.html'+(user?'?setup=1':'');link.target='_top';prompt.append(link);form.append(prompt)}box.append(form);$('activities').append(box);
let openComments=()=>{};if(isVote){const section=el('section'),toggleComments=el('button','secondary small','💬 View comments'),commentsArea=el('div','hidden'),commentForm=el('form');section.append(toggleComments,commentsArea);box.append(section);let opened=false;openComments=()=>{opened=true;commentsArea.classList.remove('hidden');toggleComments.textContent='↑ Hide comments'};toggleComments.onclick=()=>{opened=!opened;commentsArea.classList.toggle('hidden',!opened);toggleComments.textContent=opened?'↑ Hide comments':'💬 View comments'};if(user&&profile){const field=el('textarea'),send=el('button','','Post comment');field.maxLength=500;field.required=true;field.placeholder='React to the poll or quiz…';commentForm.append(field,send);commentForm.onsubmit=async e=>{e.preventDefault();const text=field.value.trim();if(!text)return;send.disabled=true;try{await db.collection('activities').doc(doc.id).collection('comments').add({uid:user.uid,text,nickname:profile.nickname,classTime:profile.classTime,emoji:profile.emoji||'😊',updatedAt:firebase.firestore.FieldValue.serverTimestamp()});field.value='';opened=true;commentsArea.classList.remove('hidden');toggleComments.textContent='↑ Hide comments'}catch(err){status('Could not comment: '+err.message)}finally{send.disabled=false}}}else{commentForm.append(el('p','muted small','Sign in and set up your profile to comment.'))}commentsArea.append(commentForm);renderConversation('comments',commentsArea,'comments');}
renderConversation('responses',replies,'answers');
function renderConversation(collectionName,container,unit){
let showAllAnswers=false;const stop=db.collection('activities').doc(doc.id).collection(collectionName).orderBy('updatedAt','desc').limit(100).onSnapshot(s=>{const old=container.querySelector('.conversation-rows');if(old)old.remove();const rows=el('div','conversation-rows');container.append(rows);rows.append(el('p','meta',s.size+' '+unit));s.docs.forEach((item,index)=>{const r=item.data(),row=el('div','reply');row.id='answer-'+item.id;if(isEmbed&&index>=3&&collectionName==='responses')row.classList.add('hidden','extra-answer');if(targetActivity===doc.id&&targetResponse===item.id&&(targetParams.get('collection')||'responses')===collectionName){row.classList.remove('hidden');setTimeout(()=>{row.scrollIntoView({behavior:'smooth',block:'center'});row.style.outline='2px solid #5eead4';setTimeout(()=>row.style.outline='',3500)},400)}const who=el('strong',r.uid===ADMIN_UID?'teacher-name':'',displayName(r.uid,r.nickname,r.emoji)+(r.uid===ADMIN_UID?'':' · '+(r.classTime||''))),message=el('div','',r.text||'');row.append(who,message);
const toggle=el('button','secondary small reply-toggle','💬 Reply');const thread=el('div','thread hidden');row.append(toggle,thread);
const threadList=el('div');thread.append(threadList);
const threadForm=el('form','thread-form hidden');
if(user&&profile){const input=el('textarea');input.maxLength=500;input.required=true;input.placeholder='Write a reply…';const send=el('button','small','Post reply');threadForm.append(input,send);threadForm.onsubmit=async e=>{e.preventDefault();const message=input.value.trim();if(!message||!user||!profile)return;send.disabled=true;try{const replyRef=item.ref.collection('replies').doc(),batch=db.batch(),now=firebase.firestore.FieldValue.serverTimestamp();batch.set(replyRef,{uid:user.uid,text:message,nickname:profile.nickname,classTime:profile.classTime,emoji:profile.emoji||'😊',createdAt:now});const participants=new Map();if(r.uid!==user.uid)participants.set(r.uid,'owner');threadList.querySelectorAll('[data-reply-uid]').forEach(node=>{const uid=node.dataset.replyUid;if(uid!==user.uid&&uid!==item.id&&!participants.has(uid))participants.set(uid,node.dataset.replyId)});for(const [uid,sourceReplyId] of participants){const nref=db.collection('notifications').doc(uid).collection('items').doc(replyRef.id);batch.set(nref,{collectionName,activityId:doc.id,responseUid:item.id,replyId:replyRef.id,sourceReplyId,senderUid:user.uid,nickname:profile.nickname,emoji:profile.emoji||'😊',text:message,read:false,createdAt:now})}await batch.commit();input.value='';status('Reply posted!')}catch(err){status('Could not reply: '+err.message)}finally{send.disabled=false}}}
else{const setup=el('a','','Sign in / set up profile to reply →');setup.href='english-corner-profile.html';setup.target='_top';threadForm.append(setup)}
thread.append(threadForm);
toggle.onclick=()=>{const opening=thread.classList.contains('hidden');thread.classList.toggle('hidden',!opening);threadForm.classList.toggle('hidden',!opening);toggle.textContent=opening?'Hide replies':'💬 Reply'};
const stopThread=item.ref.collection('replies').orderBy('createdAt','asc').limit(100).onSnapshot(q=>{threadList.replaceChildren();toggle.textContent=thread.classList.contains('hidden')?'💬 Reply'+(q.size?' ('+q.size+')':''):'Hide replies';q.forEach(replyDoc=>{const v=replyDoc.data(),entry=el('div','thread-item');entry.dataset.replyUid=v.uid;entry.dataset.replyId=replyDoc.id;entry.id='reply-'+replyDoc.id;const author=el('strong',v.uid===ADMIN_UID?'teacher-name':'',displayName(v.uid,v.nickname,v.emoji)+(v.uid===ADMIN_UID?'':' · '+(v.classTime||''))),body=el('div','',v.text||'');entry.append(author,body);if(user&&(user.uid===v.uid||user.uid===ADMIN_UID)){const del=el('button','secondary small','Delete reply');del.onclick=async()=>{if(!confirm('Delete this reply?'))return;try{await replyDoc.ref.delete()}catch(err){status(err.message)}};entry.append(del)}threadList.append(entry);if(targetActivity===doc.id&&targetResponse===item.id&&targetReply===replyDoc.id&&(targetParams.get('collection')||'responses')===collectionName){if(collectionName==='comments')openComments()thread.classList.remove('hidden');threadForm.classList.remove('hidden');toggle.textContent='Hide replies';setTimeout(()=>{entry.scrollIntoView({behavior:'smooth',block:'center'});entry.style.background='#115e59';setTimeout(()=>entry.style.background='',3500)},500)}})},e=>{threadList.replaceChildren(el('p','muted small','Replies unavailable: '+e.message))});stopResponses.push(stopThread);if(user&&(user.uid===r.uid||user.uid===ADMIN_UID)){const del=el('button','secondary small','Delete my answer');del.onclick=async()=>{if(!confirm('Delete your answer?'))return;try{await item.ref.delete()}catch(err){status(err.message)}};row.append(del)}rows.append(row)});if(isEmbed&&s.size>3&&collectionName==='responses'){if(targetActivity===doc.id)showAllAnswers=true;const more=el('button','secondary small view-all');const setExpanded=expanded=>{showAllAnswers=expanded;rows.querySelectorAll('.extra-answer').forEach(row=>row.clas }
})();
