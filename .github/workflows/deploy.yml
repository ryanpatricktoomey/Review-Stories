name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate Reps app icons
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, io
          source = base64.b64decode(Path(".github/reps-source.b64").read_text().strip(), validate=True)
          with Image.open(io.BytesIO(source)) as image:
              image.load()
              original = image.convert("RGBA")
          icons = Path("icons")
          icons.mkdir(exist_ok=True)
          for size, filename in [(192, "icon-192.png"), (512, "icon-512.png"), (180, "apple-touch-icon.png")]:
              original.resize((size, size), Image.Resampling.LANCZOS).save(icons / filename, optimize=True)
          print("Generated Reps app icons")
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
